name: DevSecOps reusable template

on:
  workflow_call:
    inputs:
      java-version:
        description: "Versión de Java que usará el proyecto"
        required: false
        type: string
        default: "25"

jobs:
  verify-template:
    name: Verify template invocation
    runs-on: ubuntu-latest

    steps:
      - name: Confirm reusable workflow
        run: |
          echo "El template reutilizable se ha ejecutado correctamente."
          echo "Java solicitada: ${{ inputs.java-version }}"

  build-and-test:
    name: Compile and test WebGoat
    runs-on: ubuntu-latest

    steps:
      - name: Download caller repository
        uses: actions/checkout@v7

      - name: Install Java
        uses: actions/setup-java@v6
        with: 
          distribution: temurin
          java-version: ${{inputs.java-version}}
          cache: maven

      - name: Compile
        run: ./mvnw -B -ntp -DskipTests compile

      - name: Tests
        run: ./mvnw -B -ntp test

  sast-semgrep:
    name: SAST with Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Download caller repository
        uses: actions/checkout@v7

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Run Semgrep
        run: |
          mkdir -p reports
          semgrep scan --config p/security-audit --json --output reports/semgrep.json .

      - name: Publish Semgrep report
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-report
          path: reports/semgrep.json
          if-no-files-found: error

  secret-scan:
    name: Secret scanning with TruffleHog
    runs-on: ubuntu-latest

    steps:
      - name: Download full repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan repository history
        run: |
          mkdir -p reports
          set -o pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            trufflesecurity/trufflehog:latest \
            git file:///src --json \
            | jq 'del(.Raw)' > reports/trufflehog.jsonl

      - name: Publish TruffleHog report
        uses: actions/upload-artifact@v7
        with:
          name: trufflehog-report
          path: reports/trufflehog.jsonl
          if-no-files-found: error
  
  sca-dependency-check:
    name: SCA with OWASP Dependency-Check
    runs-on: ubuntu-latest

    steps:
      - name: Download caller repository
        uses: actions/checkout@v7

      - name: Scan dependencies
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: WebGoat
          path: .
          format: HTML
          out: reports/dependency-check
          args: --enableRetired

      - name: Publish Dependency-Check report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: reports/dependency-check
          if-no-files-found: warn
  
  iac-kics:
    name: IaC scannning with KICS
    runs-on: ubuntu-latest

    steps: 
      - name: Download Repository
        uses: actions/checkout@v7

      - name: create report directory
        run: mkdir -p reports/kicks

      - name: Scan infrastructure definitions
        uses: checkmarx/kics-github-action@v2.1.20
        with:
          path: .
          output_path: reports/kics
          output_name: kics-results
          output_formats: json,html
          ignore_on_exit: results
          disable_secrets: true

      - name: Publish KICS report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: kics-report
          path: reports/kics
          if-no-files-found: warn
  build-and-scan-image:
    name: Build and scan Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Descarga de repositorio
        uses: actions/checkout@v7

      - name: Build image from docker file
        run: docker build -tag webgoat:${{github.sha}} .

      - name: Create report directory
        run: mkdir -p reports

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with: 
          image-ref: webgoat:${{ github.sha }}
          format: json
          output: reports/trivy-image.json
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          scanners: vuln
          exit-code: 0

      - name: Publish Trivy report
        uses: actions/upload-artifact@v7
        with:
          name: trivy-image-report
          path: reports/trivy-image.json
          if-no-files-found: error








      

