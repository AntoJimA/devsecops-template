name: DevSecOps reusable template

on:
  workflow_call:
    inputs:
      java-version:
        description: "Versión de Java que usará el proyecto"
        required: false
        type: string
        default: "25"

jobs:
  verify-template:
    name: Verify template invocation
    runs-on: ubuntu-latest

    steps:
      - name: Confirm reusable workflow
        run: |
          echo "El template reutilizable se ha ejecutado correctamente."
          echo "Java solicitada: ${{ inputs.java-version }}"

  build-and-test:
    name: Compile and test WebGoat
    runs-on: ubuntu-latest

    steps:
      - name: Download caller repository
        uses: actions/checkout@v7

      - name: Install Java
        uses: actions/setup-java@v6
        with: 
          distribution: temurin
          java-version: ${{inputs.java-version}}
          cache: maven

      - name: Compile
        run: ./mvnw -B -ntp -DskipTests compile

      - name: Tests
        run: ./mvnw -B -ntp test

  sast-semgrep:
    name: SAST with Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Download caller repository
        uses: actions/checkout@v7

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Run Semgrep
        run: |
          mkdir -p reports
          semgrep scan \
            --config p/security-audit \
            --json \
            --output reports/semgrep.json \
            
      - name: Publicamos resultados
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-report
          path: reports/semgrep.json
          if-no-files-found: error
      

